<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#4d97ff"><title>Project editor — Sprout Studio</title><link rel="stylesheet" href="site.css"><link rel="stylesheet" href="studio.css"><link rel="stylesheet" href="studio-responsive.css"></head>
<body class="studio-body"><header class="studio-nav"><a class="site-logo" href="index.html"><span>✦</span>sprout</a><a class="studio-back" href="explore.html">← Explore</a><input id="project-title" class="project-title" maxlength="50" aria-label="Project title" value="My project"><div class="studio-actions"><button id="new-button" title="Start a blank project">New</button><select id="saved-select" aria-label="Saved projects"><option value="">Open saved…</option></select><button id="import-button">Import</button><input class="file-input" id="import-file" type="file" accept="application/json,.json"><button id="export-button">Export</button><button id="save-button" class="save-button">Save</button></div></header>
<div class="editor-tabs"><a class="editor-tab active" href="#code">Code</a><a class="editor-tab" href="explore.html">Costumes</a><a class="editor-tab" href="about.html">Sounds</a></div>
<main class="studio-layout" id="code"><section class="code-side" aria-label="Code editor"><div class="category-rail"><button class="category active" data-cat="motion"><span class="category-icon">↔</span>Motion</button><button class="category" data-cat="looks"><span class="category-icon">◉</span>Looks</button><button class="category" data-cat="sound"><span class="category-icon">♪</span>Sound</button><button class="category" data-cat="events"><span class="category-icon">⚑</span>Events</button><button class="category" data-cat="control"><span class="category-icon">↻</span>Control</button><button class="category" data-cat="sensing"><span class="category-icon">◉</span>Sensing</button><button class="category" data-cat="operators"><span class="category-icon">⊕</span>Operators</button><button class="category" data-cat="variables"><span class="category-icon">▤</span>Variables</button><button class="category" data-cat="pen"><span class="category-icon">✎</span>Pen</button></div><div class="toolbox"><h2 id="toolbox-title">Motion</h2><p class="tool-hint">108 additional blocks. Click to add, or drag into your script.</p><div id="palette"></div></div></section>
<section class="script-side"><div class="script-header"><strong>Scripts</strong><span class="sprite-label" id="selected-label">Cat</span></div><div id="workspace" class="script-workspace" aria-label="Script workspace"></div></section>
<section class="right-side"><div class="stage-panel"><div class="stage-toolbar"><button id="run-button" class="green-flag" title="Run script">⚑</button><button id="stop-button" class="stop-button" title="Stop script">■</button><span id="run-state" class="run-state">Ready</span><label for="backdrop-select">Backdrop</label><select id="backdrop-select" aria-label="Choose backdrop"><option value="sky">Blue sky</option><option value="space">Space</option><option value="sunset">Sunset</option><option value="ocean">Ocean</option><option value="custom">Custom</option></select></div><div class="stage-wrap"><div id="stage" class="stage-canvas"><canvas id="pen-layer" class="pen-layer" width="480" height="360"></canvas><span class="stage-cloud">☁</span><span class="stage-sun"></span><span class="stage-hill"></span><span class="stage-hill hill-two"></span><div id="variable-monitors" class="variable-monitors"></div><div id="stage-sprites"></div></div></div></div><div class="sprite-panel"><div class="sprite-panel-top"><strong>Sprites</strong><div class="sprite-actions"><button id="add-sprite">＋ Add sprite</button><button id="delete-sprite" title="Delete selected sprite">− Delete</button></div></div><div id="sprite-list" class="sprite-list"></div></div></section></main><div class="toast" id="toast" role="status"></div><script src="block-library.js"></script><script src="studio.js"></script></body></html>
